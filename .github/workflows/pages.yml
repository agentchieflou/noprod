name: Pages

# Every push to main builds the app for /noprod/ and deploys it. Until an
# admin sets Settings → Pages → Source to "GitHub Actions", the deploy job
# fails; that only affects runs on main, never a pull request's CI.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: npx vite build
        working-directory: apps/frontend
        env:
          NOPROD_BASE: /noprod/
      # Sourcemaps are not served
      - run: rm -f apps/frontend/dist/assets/*.map
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
