name: Audio core

# GhostDAW builds and tests on every platform it ships on, whenever the
# audio core, the shared protocol types or the frontend's native bridge
# change.
on:
  pull_request:
    paths: ['apps/audio_core/**', 'packages/shared/**', 'apps/frontend/src/native/**', '.github/workflows/audio-core.yml']
  push:
    branches: [main]
    paths: ['apps/audio_core/**', 'packages/shared/**', 'apps/frontend/src/native/**', '.github/workflows/audio-core.yml']

permissions:
  contents: read

concurrency:
  group: audio-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ninja
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build; else brew install ninja; fi
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S apps/audio_core -B build/audio_core -G Ninja -DCMAKE_BUILD_TYPE=Release -DGHOSTDAW_BUILD_TESTS=ON
      - name: Configure (MSVC)
        if: runner.os == 'Windows'
        run: cmake -S apps/audio_core -B build/audio_core -DGHOSTDAW_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/audio_core --config Release
      - name: Test
        if: runner.os != 'Windows'
        run: build/audio_core/tests/ghostdaw_tests
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: build\audio_core\tests\Release\ghostdaw_tests.exe
