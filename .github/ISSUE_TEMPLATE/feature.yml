name: Feature request
description: Suggest a change or a new capability
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like noprod to do. Other ways you considered are welcome too.
    validations:
      required: true
