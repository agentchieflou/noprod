version: 2
updates:
  # Minor and patch updates come grouped; a major one comes on its own, so
  # it can be judged (and fixed) by itself
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
  # JUCE is being removed (#134); nothing else is a submodule
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: apps/audio_core/JUCE
