version: 2
updates:
  # Minor and patch updates come grouped; a major one comes on its own, so
  # it can be judged (and fixed) by itself
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    # Node's types move when the Node we run (.nvmrc) does, by hand
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
